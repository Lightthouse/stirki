[project]
name = "stirki"
version = "0.2.0"
description = "Stirki ON — сервис доставки стирки"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.1.1",
    "sqlalchemy[asyncio]>=2.0.45",
    "asyncpg>=0.30.0",
    "uvicorn>=0.38.0",
    "yookassa>=3.0.0",
    "smsaero-api-async>=3.1.0",
]

[dependency-groups]
dev = [
    "icecream>=2.1.8",
    "ruff>=0.14.1",
    "qrcode[pil]>=8.0",
]
