services:
  postgres:
    image: postgres:16-alpine
    container_name: stirki-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: stirki
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg_init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "stirki"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stirki-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - prod

  frontend:
    build:
      context: ./frontend
    container_name: stirki-frontend-build
    volumes:
      - frontend_dist:/dist
    profiles:
      - prod

  caddy:
    image: caddy:2-alpine
    container_name: stirki-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - frontend_dist:/srv:ro
    depends_on:
      - backend
      - frontend
    profiles:
      - prod

  adminer:
    image: adminer:latest
    container_name: stirki-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DESIGN: pepa-linha-dark

  baserow:
    image: baserow/baserow:2.0.3
    container_name: stirki-baserow
    restart: unless-stopped
    ports:
      - "${BASEROW_PORT:-8082}:80"
    volumes:
      - baserow_data:/baserow/data
    environment:
      BASEROW_PUBLIC_URL: http://localhost:${BASEROW_PORT:-8082}
      BASEROW_DISABLE_TELEMETRY: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  baserow_data:
  caddy_data:
  caddy_config:
  frontend_dist:
