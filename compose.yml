services:
  postgres:
    image: postgres:16-alpine
    container_name: stirki-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: stirki
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg_init:/docker-entrypoint-initdb.d
    # Только localhost: Docker обходит файрвол, и без 127.0.0.1 порт открыт в интернет.
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "stirki"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stirki-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      APP_ENV: ${APP_ENV:-development}
    # Рекламные картинки: загружаются через админку и должны переживать пересборку образа.
    volumes:
      - ./advertising:/app/advertising
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - prod

  frontend:
    build:
      context: ./frontend
    container_name: stirki-frontend-build
    volumes:
      - frontend_dist:/dist
    profiles:
      - prod

  caddy:
    image: caddy:2-alpine
    container_name: stirki-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - frontend_dist:/srv:ro
    depends_on:
      - backend
      - frontend
    profiles:
      - prod

  adminer:
    image: adminer:latest
    container_name: stirki-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DESIGN: pepa-linha-dark

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  frontend_dist:
